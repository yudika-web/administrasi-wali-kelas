<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163b6d"><title>Administrasi Kelas Digital</title>
<style>
:root{--navy:#163b6d;--blue:#2864b4;--pale:#eef4fb;--ink:#1d2939;--muted:#667085;--line:#e4eaf2;--white:#fff;--green:#14805e;--red:#c23c42;--amber:#b7791f;--shadow:0 8px 28px #152f5010}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--navy);color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:0 9px 22px;border-bottom:1px solid #ffffff24}.brand-mark{width:42px;height:42px;border-radius:13px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:22px;font-weight:800}.brand strong{display:block;font-size:15px}.brand small{color:#c7d8ef}.nav-label{font-size:10px;letter-spacing:1.5px;color:#a9c2e2;margin:20px 10px 8px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#dbe7f7;text-align:left;padding:10px 11px;border-radius:9px;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff1b;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.sidebar-note{font-size:11px;color:#b8cce4;margin:24px 10px 10px}.main{margin-left:250px;width:calc(100% - 250px);min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.top-left{display:flex;align-items:center;gap:12px}.eyebrow{font-size:11px;color:var(--muted)}h1{font-size:21px;margin:1px 0;font-weight:750;letter-spacing:-.4px}.top-actions{display:flex;align-items:center;gap:10px}.privacy{background:#eef8f3;color:#167653;padding:7px 10px;border-radius:20px;font-size:11px}.content{padding:27px 30px 44px;max-width:1600px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:23px}.welcome p{margin:5px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:9px 13px;font-weight:650;display:inline-flex;gap:7px;align-items:center;justify-content:center}.btn:hover{background:#f6f8fb}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:var(--red);border-color:#f2cccc}.btn.small{font-size:12px;padding:6px 9px}.btn:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--pale);color:var(--blue);font-size:17px}.stat-value{font-size:27px;font-weight:800;margin:9px 0 1px;letter-spacing:-.7px}.stat-sub{font-size:11px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:18px;min-width:0}.panel-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{font-size:15px;margin:0}.panel-body{padding:19px 20px}.dash-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.chart{display:flex;gap:13px;align-items:flex-end;height:180px;padding:12px 4px 0;border-bottom:1px solid var(--line)}.bar-group{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;min-width:0}.bar-stack{width:min(36px,75%);height:calc(100% - 22px);display:flex;align-items:flex-end;background:#f0f4fa;border-radius:7px 7px 0 0;overflow:hidden}.bar{width:100%;background:#3978c9;min-height:0;border-radius:6px 6px 0 0}.bar-label{font-size:10px;color:var(--muted);white-space:nowrap}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.empty{padding:28px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:5px;min-width:0}.field label{font-size:12px;font-weight:650;color:#475467}.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #d7dfeb;border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink);min-width:0;width:100%;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus,.toolbar select:focus{border-color:#6798dc;box-shadow:0 0 0 3px #2c70cb16}.field textarea{min-height:85px;resize:vertical}.toolbar .search{min-width:220px;flex:1}.table-wrap{overflow:auto;width:100%}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;background:#f8fafc;color:#667085;font-size:11px;font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line)}td{padding:12px 14px;border-bottom:1px solid #edf0f5;font-size:12px}tbody tr:hover{background:#fbfcfe}tbody tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:750}.pill.Hadir{background:#e8f7ef;color:#167653}.pill.Sakit{background:#fff4dc;color:#95610a}.pill.Izin{background:#eaf2ff;color:#2459a6}.pill.Alpa{background:#ffeded;color:#b42d36}.row-actions{display:flex;gap:5px}.row-actions button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 7px;font-size:11px}.row-actions button:hover{background:#f2f5fa}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid .wide{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#10233d80;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-backdrop.show{display:flex}.modal{background:#fff;width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:16px;box-shadow:0 25px 80px #0003}.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:17px}.modal-body{padding:21px 22px}.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.xbtn{border:0;background:transparent;font-size:23px;color:var(--muted)}.notice{padding:12px 14px;background:#eef5ff;border-radius:9px;color:#335b8d;font-size:12px;margin-bottom:16px}.mobile-menu{display:none}.report-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.report-item{border:1px solid var(--line);border-radius:10px;padding:15px}.report-item small{display:block;color:var(--muted);margin-bottom:5px}.report-item strong{font-size:22px}.footnote{font-size:11px;color:var(--muted);margin-top:16px}.toast{position:fixed;bottom:20px;right:20px;background:#163b6d;color:white;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:50;display:none}.toast.show{display:block}.settings-note{background:#fff9e9;border:1px solid #f3e4b8;color:#775a18;padding:12px;border-radius:9px;font-size:12px}
@media(max-width:1050px){.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-grid{grid-template-columns:1fr}.content{padding:22px}.topbar{padding:0 22px}}
@media(max-width:700px){.sidebar{transform:translateX(-100%);width:260px;transition:transform .2s}.sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vmax #0b1f3880}.main{margin-left:0;width:100%}.topbar{height:65px;padding:0 15px}.mobile-menu{display:inline-flex}.privacy{display:none}.content{padding:19px 13px 32px}.welcome{align-items:flex-start;flex-direction:column}.welcome h1{font-size:20px}.cards{gap:9px}.stat{padding:13px}.stat-value{font-size:23px}.panel-head{padding:14px}.panel-body{padding:14px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.report-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar .search{min-width:100%}.top-actions .btn{padding:8px}.brand{padding-bottom:17px}}
@media print{.sidebar,.topbar,.no-print,.btn,.row-actions{display:none!important}.main{margin:0;width:100%}.content{padding:0}.panel,.stat{box-shadow:none;break-inside:avoid}body{background:#fff}.table-wrap{overflow:visible}table{white-space:normal}th,td{font-size:9pt;padding:6px}.cards{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">AK</div><div><strong>Administrasi Kelas</strong><small>Digital • Wali Kelas</small></div></div><div class="nav-label">MENU UTAMA</div><nav class="nav" id="nav"></nav><div class="sidebar-note">Data disimpan di browser perangkat ini. Tidak ada sinkronisasi cloud.</div></aside><main class="main"><header class="topbar"><div class="top-left"><button class="btn mobile-menu" onclick="toggleMenu()">☰</button><div><div class="eyebrow">ADMINISTRASI GURU</div><h1 id="pageTitle">Dashboard</h1></div></div><div class="top-actions"><span class="privacy">● Penyimpanan lokal aktif</span><button class="btn" onclick="exportBackup()">⇩ Cadangkan</button></div></header><section class="content" id="content"></section></main></div><div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Formulir</h2><button class="xbtn" onclick="closeModal()" aria-label="Tutup">×</button></div><form id="dataForm"><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Batal</button><button type="submit" class="btn primary">Simpan data</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const STORE='administrasiKelasDigital_v1';
const modules=[
{id:'identitas',name:'Data Identitas Kelas',icon:'▣',singular:'Identitas kelas',fields:[['namaSekolah','Nama sekolah','text'],['kelas','Kelas/Rombel','text'],['tahunAjaran','Tahun ajaran','text'],['semester','Semester','select',['Ganjil','Genap']],['waliKelas','Nama wali kelas','text'],['nip','NIP wali kelas','text'],['ruang','Ruang kelas','text'],['jumlahTarget','Target jumlah siswa','number']]},
{id:'siswa',name:'Data Siswa',icon:'♙',singular:'Siswa',fields:[['nis','NIS','text'],['nisn','NISN','text'],['nama','Nama lengkap','text',null,true],['jk','Jenis kelamin','select',['Laki-laki','Perempuan']],['tanggalLahir','Tanggal lahir','date'],['alamat','Alamat','textarea'],['status','Status siswa','select',['Aktif','Pindah','Lulus','Keluar']]]},
{id:'absensi',name:'Absensi Harian',icon:'✓',singular:'Absensi',fields:[['tanggal','Tanggal','date',null,true],['siswaId','Nama siswa','student',null,true],['status','Status kehadiran','select',['Hadir','Sakit','Izin','Alpa'],true],['keterangan','Keterangan','text']]},
{id:'nilai',name:'Data Nilai dan Asesmen',icon:'✎',singular:'Nilai/asesmen',fields:[['tanggal','Tanggal','date'],['siswaId','Nama siswa','student',null,true],['mapel','Mata pelajaran','text',null,true],['asesmen','Jenis asesmen','select',['Formatif','Sumatif','Proyek','Praktik','Tugas','Ujian']],['materi','Materi/kompetensi','text'],['nilai','Nilai (0–100)','number',null,true],['catatan','Catatan','textarea']]},
{id:'jurnal',name:'Jurnal Kegiatan Kelas',icon:'▤',singular:'Jurnal kegiatan',fields:[['tanggal','Tanggal','date',null,true],['waktu','Waktu','text'],['kegiatan','Kegiatan','text',null,true],['tujuan','Tujuan','textarea'],['hasil','Hasil/refleksi','textarea'],['petugas','Guru/petugas','text']]},
{id:'perkembangan',name:'Catatan Perkembangan Siswa',icon:'♡',singular:'Catatan perkembangan',fields:[['tanggal','Tanggal','date',null,true],['siswaId','Nama siswa','student',null,true],['aspek','Aspek','select',['Akademik','Sikap','Sosial','Kemandirian','Kesehatan','Lainnya']],['catatan','Catatan perkembangan','textarea',null,true],['tindakLanjut','Tindak lanjut','textarea'],['privat','Catatan sensitif?','select',['Tidak','Ya']]]},
{id:'prestasi',name:'Data Prestasi dan Pelanggaran',icon:'★',singular:'Prestasi/pelanggaran',fields:[['tanggal','Tanggal','date',null,true],['siswaId','Nama siswa','student',null,true],['jenis','Kategori','select',['Prestasi','Pelanggaran'],true],['deskripsi','Uraian','textarea',null,true],['tingkat','Tingkat','select',['Kelas','Sekolah','Kecamatan','Kabupaten/Kota','Provinsi','Nasional','Internasional']],['tindakLanjut','Tindak lanjut/penghargaan','textarea']]},
{id:'wali',name:'Data Orang Tua/Wali',icon:'♧',singular:'Orang tua/wali',fields:[['siswaId','Nama siswa','student',null,true],['namaWali','Nama orang tua/wali','text',null,true],['hubungan','Hubungan','select',['Ayah','Ibu','Wali','Lainnya']],['telepon','Nomor telepon','tel'],['pekerjaan','Pekerjaan','text'],['alamat','Alamat','textarea']]},
{id:'jadwal',name:'Jadwal Pelajaran',icon:'▦',singular:'Jadwal pelajaran',fields:[['hari','Hari','select',['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],true],['jamMulai','Jam mulai','time',null,true],['jamSelesai','Jam selesai','time',null,true],['mapel','Mata pelajaran','text',null,true],['guru','Guru pengampu','text'],['ruang','Ruang','text']]},
{id:'inventaris',name:'Inventaris Kelas',icon:'▣',singular:'Inventaris',fields:[['barang','Nama barang','text',null,true],['jumlah','Jumlah','number',null,true],['kondisi','Kondisi','select',['Baik','Rusak ringan','Rusak berat','Hilang']],['tanggal','Tanggal pendataan','date'],['sumber','Sumber/perolehan','text'],['catatan','Catatan','textarea']]},
{id:'kas',name:'Kas Kelas',icon:'◉',singular:'Transaksi kas',fields:[['tanggal','Tanggal','date',null,true],['jenis','Jenis transaksi','select',['Pemasukan','Pengeluaran'],true],['kategori','Kategori','text',null,true],['uraian','Uraian','text'],['jumlah','Jumlah (Rp)','number',null,true],['penanggungJawab','Penanggung jawab','text']]},
{id:'penghubung',name:'Buku Penghubung',icon:'✉',singular:'Buku penghubung',fields:[['tanggal','Tanggal','date',null,true],['siswaId','Nama siswa','student',null,true],['pengirim','Pengirim','select',['Wali kelas','Orang tua/wali','Guru mapel','Lainnya']],['pesan','Pesan/informasi','textarea',null,true],['tindakLanjut','Tanggapan/tindak lanjut','textarea'],['status','Status','select',['Belum ditanggapi','Diproses','Selesai']]]},
{id:'laporan',name:'Laporan Administrasi',icon:'▧',singular:'Laporan',fields:[['tanggal','Tanggal laporan','date'],['jenis','Jenis laporan','select',['Absensi','Nilai','Kas kelas','Inventaris','Kegiatan kelas','Perkembangan siswa','Umum']],['periode','Periode','text'],['ringkasan','Ringkasan laporan','textarea',null,true],['tindakLanjut','Rekomendasi/tindak lanjut','textarea'],['penyusun','Disusun oleh','text']]}
];
let db=loadDB(),current='dashboard',searchTerm='',filters={},editingId=null,editingModule=null;
function loadDB(){try{let d=JSON.parse(localStorage.getItem(STORE)||'{}');if(!d.tables)d.tables={};for(const m of modules)if(!Array.isArray(d.tables[m.id]))d.tables[m.id]=[];if(!d.meta)d.meta={};return d}catch(e){return {tables:Object.fromEntries(modules.map(m=>[m.id,[]])),meta:{}}}}
function saveDB(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch(e){toast('Penyimpanan gagal. Ruang browser mungkin penuh.');return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function rows(mid){return db.tables[mid]||[]}function studentName(sid){return rows('siswa').find(s=>s.id===sid)?.nama||'(siswa tidak ditemukan)'}function fmtDate(d){if(!d)return '—';let x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}function rupiah(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function navRender(){let nav=document.getElementById('nav');nav.innerHTML=`<button class="${current==='dashboard'?'active':''}" onclick="go('dashboard')"><span class="ico">⌂</span>Dashboard</button><div class="nav-label">DATA KELAS</div>`+modules.map(m=>`<button class="${current===m.id?'active':''}" onclick="go('${m.id}')"><span class="ico">${m.icon}</span>${m.name}</button>`).join('')+`<div class="nav-label">UTILITAS</div><button onclick="go('rekap')" class="${current==='rekap'?'active':''}"><span class="ico">▥</span>Rekap Absensi Otomatis</button><button onclick="go('pengaturan')" class="${current==='pengaturan'?'active':''}"><span class="ico">⚙</span>Pengaturan & Cadangan</button>`}
function go(page){current=page;searchTerm='';filters={};navRender();document.getElementById('pageTitle').textContent=page==='dashboard'?'Dashboard':page==='rekap'?'Rekap Absensi Otomatis':page==='pengaturan'?'Pengaturan & Cadangan':modules.find(m=>m.id===page)?.name||'Dashboard';document.getElementById('sidebar').classList.remove('open');render()}
function statCard(label,value,sub,icon){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-sub">${sub}</div></div>`}
function dashboard(){let students=rows('siswa').filter(s=>!s.status||s.status==='Aktif'),date=today(),att=rows('absensi').filter(a=>a.tanggal===date),count=Object.fromEntries(['Hadir','Sakit','Izin','Alpa'].map(s=>[s,att.filter(a=>a.status===s).length]));let meta=rows('identitas')[0]||{};let saldo=rows('kas').reduce((a,r)=>a+(r.jenis==='Pemasukan'?1:-1)*(Number(r.jumlah)||0),0);let grades=rows('nilai').map(r=>Number(r.nilai)).filter(n=>Number.isFinite(n));let avg=grades.length?(grades.reduce((a,b)=>a+b,0)/grades.length).toLocaleString('id-ID',{maximumFractionDigits:1}):'—';let months=[];for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;let total=rows('absensi').filter(a=>a.tanggal?.startsWith(key));months.push({label:d.toLocaleDateString('id-ID',{month:'short'}),n:total.length?Math.round(total.filter(a=>a.status==='Hadir').length/total.length*100):0})}let max=Math.max(100,...months.map(m=>m.n));return `<div class="welcome"><div><h1>Selamat datang di Administrasi Kelas</h1><p>${esc(meta.namaSekolah||'Nama sekolah belum diisi')} · ${esc(meta.kelas||'Kelas belum diisi')} · Tahun ajaran ${esc(meta.tahunAjaran||'—')}</p></div><button class="btn primary" onclick="openForm('absensi')">＋ Catat absensi</button></div><div class="cards">${statCard('Siswa aktif',students.length,'Data siswa terdaftar','♙')}${statCard('Kehadiran hari ini',count.Hadir,`${count.Sakit} sakit · ${count.Izin} izin · ${count.Alpa} alpa`,'✓')}${statCard('Rata-rata nilai',avg,`${grades.length} nilai tercatat`,'✎')}${statCard('Saldo kas kelas',rupiah(saldo),`${rows('kas').length} transaksi tercatat`,'◉')}</div><div class="dash-grid"><section class="panel"><div class="panel-head"><h2>Ringkasan absensi 6 bulan</h2><button class="btn small" onclick="go('rekap')">Lihat rekap ↗</button></div><div class="panel-body"><div class="chart">${months.map(m=>`<div class="bar-group"><div class="bar-stack"><div class="bar" style="height:${m.n/max*100}%"></div></div><span class="bar-label">${m.label}</span></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#3978c9"></i>Persentase hadir dari catatan absensi</span></div><p class="footnote">Grafik hanya menggunakan data yang sudah dimasukkan. Bulan tanpa catatan ditampilkan 0%.</p></div></section><section class="panel"><div class="panel-head"><h2>Status absensi hari ini</h2><span class="muted">${fmtDate(date)}</span></div><div class="panel-body">${['Hadir','Sakit','Izin','Alpa'].map(s=>{let n=count[s],pct=att.length?Math.round(n/att.length*100):0;return `<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span><span class="pill ${s}">${s}</span></span><b>${n} <small class="muted">(${pct}%)</small></b></div><div style="height:7px;background:#edf1f6;border-radius:9px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${({Hadir:'#16805e',Sakit:'#d6a02d',Izin:'#3978c9',Alpa:'#c23c42'})[s]}"></div></div></div>`}).join('')}${!att.length?'<div class="empty">Belum ada catatan absensi hari ini.</div>':''}<button class="btn" style="width:100%;margin-top:10px" onclick="go('absensi')">Buka absensi harian</button></div></section></div><section class="panel"><div class="panel-head"><h2>Akses cepat administrasi</h2><span class="muted">Pilih menu untuk mulai mengisi</span></div><div class="panel-body"><div class="report-grid">${[['siswa','♙','Data siswa'],['nilai','✎','Nilai & asesmen'],['jurnal','▤','Jurnal kelas'],['wali','♧','Orang tua/wali'],['kas','◉','Kas kelas'],['laporan','▧','Laporan administrasi']].map(a=>`<button class="report-item" style="text-align:left;background:white;cursor:pointer" onclick="go('${a[0]}')"><span style="font-size:20px;color:var(--blue)">${a[1]}</span><strong style="display:block;font-size:13px;margin-top:9px">${a[2]}</strong><small>Buka dan kelola data</small></button>`).join('')}</div></div></section><div class="settings-note">Privasi: aplikasi ini menyimpan data pada penyimpanan lokal browser perangkat ini. Data dapat hilang jika data situs/browser dihapus. Gunakan fitur Cadangkan secara berkala dan jangan berbagi file cadangan tanpa izin.</div>`}
function fieldInput(f,val=''){let [key,label,type,opts,required]=f;let req=required?'required':'';if(type==='student'){return `<div class="field"><label>${label}${required?' *':''}</label><select name="${key}" ${req}><option value="">Pilih siswa...</option>${rows('siswa').map(s=>`<option value="${esc(s.id)}" ${val===s.id?'selected':''}>${esc(s.nama||'(tanpa nama)')} ${s.nis?'· '+esc(s.nis):''}</option>`).join('')}</select>${!rows('siswa').length?'<small class="muted">Tambahkan data siswa terlebih dahulu.</small>':''}</div>`}if(type==='select'){return `<div class="field"><label>${label}${required?' *':''}</label><select name="${key}" ${req}><option value="">Pilih...</option>${opts.map(o=>`<option ${String(val)===o?'selected':''} value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`}if(type==='textarea')return `<div class="field wide"><label>${label}${required?' *':''}</label><textarea name="${key}" ${req}>${esc(val)}</textarea></div>`;return `<div class="field"><label>${label}${required?' *':''}</label><input name="${key}" type="${type}" ${req} ${type==='number'&&key==='nilai'?'min="0" max="100" step="0.01"':type==='number'?'min="0" step="any"':''} value="${esc(val)}" ${type==='number'?'placeholder="0"':''}></div>`}
function openForm(mid,rowId=null){let m=modules.find(x=>x.id===mid);if(!m)return;let row=rowId?rows(mid).find(x=>x.id===rowId):{};editingId=rowId;editingModule=mid;document.getElementById('modalTitle').textContent=(rowId?'Edit ':'Tambah ')+m.singular;document.getElementById('modalBody').innerHTML=(mid==='identitas'?'<div class="notice">Isi identitas kelas sesuai kondisi sebenarnya. Tidak ada data awal yang dibuat otomatis.</div>':'')+`<div class="form-grid">${m.fields.map(f=>fieldInput(f,row?.[f[0]]??(f[0]==='tanggal'&&!rowId?today():''))).join('')}</div>`;document.getElementById('modalBackdrop').classList.add('show');}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show');editingId=null;editingModule=null}
document.getElementById('dataForm').addEventListener('submit',e=>{e.preventDefault();let m=modules.find(x=>x.id===editingModule);if(!m)return;let fd=new FormData(e.target),obj={};for(const f of m.fields)obj[f[0]]=String(fd.get(f[0])||'').trim();for(const f of m.fields)if(f[4]&&!obj[f[0]]){toast('Lengkapi kolom wajib: '+f[1]);e.target.elements[f[0]]?.focus();return}if(m.id==='nilai'&&(Number(obj.nilai)<0||Number(obj.nilai)>100)){toast('Nilai harus berada pada rentang 0 sampai 100.');return}if(m.id==='jadwal'&&obj.jamSelesai<=obj.jamMulai){toast('Jam selesai harus setelah jam mulai.');return}if(m.id==='identitas'&&rows('identitas').length&&!editingId){toast('Identitas kelas sudah ada. Gunakan Edit untuk memperbarui.');return}if(m.id==='absensi'&&rows('absensi').some(r=>r.tanggal===obj.tanggal&&r.siswaId===obj.siswaId&&r.id!==editingId)){toast('Absensi siswa pada tanggal tersebut sudah ada. Edit catatan yang tersedia.');return}if(editingId){let i=rows(m.id).findIndex(r=>r.id===editingId);if(i>=0)db.tables[m.id][i]={...db.tables[m.id][i],...obj,updatedAt:new Date().toISOString()}}else db.tables[m.id].push({id:id(),...obj,createdAt:new Date().toISOString()});saveDB();closeModal();render();toast('Data berhasil disimpan pada perangkat ini.');});
function deleteRow(mid,rid){let r=rows(mid).find(x=>x.id===rid);if(!r)return;let label=r.nama||r.kegiatan||r.barang||r.mapel||r.kategori||r.deskripsi||r.nis||modules.find(m=>m.id===mid)?.singular||'data';if(!confirm(`Hapus data "${label}"? Tindakan ini tidak dapat dibatalkan.`))return;db.tables[mid]=rows(mid).filter(x=>x.id!==rid);saveDB();render();toast('Data dihapus.')}
function cellValue(mid,f,r){let v=r[f[0]];if(f[0]==='siswaId')return esc(studentName(v));if(f[0]==='tanggal'||f[0]==='tanggalLahir')return fmtDate(v);if(v===undefined||v==='')return '<span class="muted">—</span>';if(mid==='kas'&&f[0]==='jumlah')return rupiah(v);if(mid==='nilai'&&f[0]==='nilai')return `<b>${esc(v)}</b>`;if(f[0]==='status'&&['Hadir','Sakit','Izin','Alpa'].includes(v))return `<span class="pill ${esc(v)}">${esc(v)}</span>`;return esc(v)}
function modulePage(mid){let m=modules.find(x=>x.id===mid),data=rows(mid);let q=searchTerm.toLowerCase();if(q)data=data.filter(r=>m.fields.some(f=>String(f[0]==='siswaId'?studentName(r[f[0]]):r[f[0]]||'').toLowerCase().includes(q)));if(mid==='absensi'){let month=filters.month||'';if(month)data=data.filter(r=>(r.tanggal||'').startsWith(month));if(filters.status)data=data.filter(r=>r.status===filters.status)}let fields=m.fields;return `<div class="welcome"><div><h1>${m.name}</h1><p>Kelola, cari, ubah, dan cetak data administrasi kelas.</p></div><button class="btn primary no-print" onclick="openForm('${mid}')">＋ Tambah data</button></div>${mid==='siswa'?`<div class="notice">Data siswa masih kosong sampai guru memasukkannya. Hindari memasukkan informasi sensitif yang tidak diperlukan.</div>`:''}${mid==='absensi'?`<section class="panel"><div class="panel-body"><div class="toolbar"><div class="field"><label>Tanggal absensi cepat</label><input type="date" id="bulkDate" value="${esc(filters.date||today())}"></div><button class="btn" onclick="openBulkAttendance()">▦ Isi absensi satu kelas</button><span class="muted">Mencatat satu status per siswa per tanggal.</span></div></div></section>`:''}<section class="panel"><div class="panel-head"><h2>Daftar data <span class="muted">(${data.length})</span></h2><div class="toolbar no-print"><input class="search" placeholder="⌕ Cari data..." value="${esc(searchTerm)}" oninput="setSearch(this.value)">${mid==='absensi'?`<input type="month" aria-label="Filter bulan" value="${esc(filters.month||'')}" onchange="setFilter('month',this.value)"><select aria-label="Filter status" onchange="setFilter('status',this.value)"><option value="">Semua status</option>${['Hadir','Sakit','Izin','Alpa'].map(s=>`<option ${filters.status===s?'selected':''}>${s}</option>`).join('')}</select>`:''}<button class="btn small" onclick="exportCSV('${mid}')">Ekspor CSV</button><button class="btn small" onclick="window.print()">Cetak / PDF</button></div></div><div class="table-wrap"><table><thead><tr><th>No.</th>${fields.map(f=>`<th>${f[1]}</th>`).join('')}<th class="no-print">Aksi</th></tr></thead><tbody>${data.length?data.map((r,i)=>`<tr><td>${i+1}</td>${fields.map(f=>`<td>${cellValue(mid,f,r)}</td>`).join('')}<td class="no-print"><div class="row-actions"><button onclick="openForm('${mid}','${r.id}')">Edit</button><button onclick="deleteRow('${mid}','${r.id}')">Hapus</button></div></td></tr>`).join(''):`<tr><td colspan="${fields.length+2}"><div class="empty"><b>Belum ada data</b>Gunakan tombol “Tambah data” untuk mulai mengisi.</div></td></tr>`}</tbody></table></div></section>${mid==='kas'?cashSummary():mid==='nilai'?gradeSummary():''}<p class="footnote">Data tersimpan di penyimpanan lokal browser ini. Ekspor CSV dapat dibuka di Excel atau aplikasi spreadsheet.</p>`}
function cashSummary(){let inc=rows('kas').filter(r=>r.jenis==='Pemasukan').reduce((s,r)=>s+(+r.jumlah||0),0),out=rows('kas').filter(r=>r.jenis==='Pengeluaran').reduce((s,r)=>s+(+r.jumlah||0),0);return `<div class="cards">${statCard('Total pemasukan',rupiah(inc),'Akumulasi transaksi masuk','↙')}${statCard('Total pengeluaran',rupiah(out),'Akumulasi transaksi keluar','↗')}${statCard('Saldo kas',rupiah(inc-out),'Pemasukan dikurangi pengeluaran','◉')}</div>`}
function gradeSummary(){let a=rows('nilai').map(r=>+r.nilai).filter(n=>Number.isFinite(n)),avg=a.length?a.reduce((x,y)=>x+y,0)/a.length:0;return `<div class="panel"><div class="panel-head"><h2>Ringkasan nilai</h2></div><div class="panel-body">Jumlah nilai: <b>${a.length}</b> &nbsp; Rata-rata: <b>${a.length?avg.toLocaleString('id-ID',{maximumFractionDigits:2}):'—'}</b> &nbsp; Nilai tertinggi: <b>${a.length?Math.max(...a):'—'}</b> &nbsp; Nilai terendah: <b>${a.length?Math.min(...a):'—'}</b></div></div>`}
function setSearch(v){let el=document.activeElement;let pos=el?.selectionStart;searchTerm=v;let y=window.scrollY;render();let inp=document.querySelector('.search');if(inp){inp.focus();try{inp.setSelectionRange(pos,pos)}catch(e){}}window.scrollTo(0,y)}function setFilter(k,v){filters[k]=v;render()}
function rekapPage(){let month=filters.month||today().slice(0,7),students=rows('siswa').filter(s=>!s.status||s.status==='Aktif'),att=rows('absensi').filter(a=>(a.tanggal||'').startsWith(month)),totals=Object.fromEntries(['Hadir','Sakit','Izin','Alpa'].map(s=>[s,att.filter(a=>a.status===s).length]));return `<div class="welcome"><div><h1>Rekap Absensi Otomatis</h1><p>Ringkasan absensi per siswa dan per bulan berdasarkan catatan yang tersedia.</p></div><button class="btn" onclick="window.print()">Cetak / Simpan PDF</button></div><section class="panel"><div class="panel-body"><div class="toolbar"><div class="field"><label>Pilih bulan rekap</label><input type="month" value="${esc(month)}" onchange="setFilter('month',this.value)"></div><button class="btn" onclick="exportAttendanceSummary('${month}')">Ekspor rekap CSV</button></div></div></section><div class="cards">${statCard('Hadir',totals.Hadir,'Catatan bulan terpilih','✓')}${statCard('Sakit',totals.Sakit,'Catatan bulan terpilih','＋')}${statCard('Izin',totals.Izin,'Catatan bulan terpilih','↗')}${statCard('Alpa',totals.Alpa,'Catatan bulan terpilih','!')}</div><section class="panel"><div class="panel-head"><h2>Rekap per siswa · ${esc(month)}</h2><span class="muted">${students.length} siswa aktif</span></div><div class="table-wrap"><table><thead><tr><th>No.</th><th>Nama siswa</th><th>NIS</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alpa</th><th>Total catatan</th><th>% Hadir</th></tr></thead><tbody>${students.length?students.map((s,i)=>{let a=att.filter(x=>x.siswaId===s.id),n=Object.fromEntries(['Hadir','Sakit','Izin','Alpa'].map(k=>[k,a.filter(x=>x.status===k).length])),pct=a.length?Math.round(n.Hadir/a.length*100):0;return `<tr><td>${i+1}</td><td>${esc(s.nama||'—')}</td><td>${esc(s.nis||'—')}</td><td>${n.Hadir}</td><td>${n.Sakit}</td><td>${n.Izin}</td><td>${n.Alpa}</td><td>${a.length}</td><td>${a.length?pct+'%':'—'}</td></tr>`}).join(''):`<tr><td colspan="9"><div class="empty"><b>Data siswa belum tersedia</b>Tambahkan siswa dan catatan absensi untuk membangun rekap.</div></td></tr>`}</tbody></table></div></section><div class="notice">Persentase hadir dihitung dari catatan absensi yang sudah diinput untuk siswa pada bulan terpilih, bukan dari jumlah hari sekolah. Hari tanpa catatan tidak dihitung.</div>`}
function settingsPage(){return `<div class="welcome"><div><h1>Pengaturan & Cadangan</h1><p>Atur penyimpanan dan pindahkan data antarperangkat secara manual.</p></div></div><section class="panel"><div class="panel-head"><h2>Cadangkan dan pulihkan data</h2></div><div class="panel-body"><p>Cadangan berisi seluruh data administrasi dalam format JSON. Simpan di lokasi yang aksesnya dibatasi. File ini tidak dienkripsi.</p><div class="toolbar"><button class="btn primary" onclick="exportBackup()">⇩ Unduh cadangan JSON</button><label class="btn" for="restoreFile">⇧ Pulihkan dari JSON</label><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreBackup(this.files[0])"></div><p class="footnote">Pemulihan akan mengganti data lokal saat ini. Pastikan membuat cadangan terlebih dahulu.</p></div></section><section class="panel"><div class="panel-head"><h2>Data lokal</h2></div><div class="panel-body"><div class="report-grid"><div class="report-item"><small>Jumlah siswa</small><strong>${rows('siswa').length}</strong></div><div class="report-item"><small>Total catatan absensi</small><strong>${rows('absensi').length}</strong></div><div class="report-item"><small>Modul administrasi</small><strong>14</strong></div></div><div class="settings-note" style="margin-top:15px">Data hanya berada di browser/perangkat ini. Aplikasi tidak mengirim data ke server atau cloud. Jika browser menghapus penyimpanan situs, data dapat hilang. Untuk penggunaan bersama atau data sensitif, gunakan sistem sekolah yang memiliki autentikasi, kontrol akses, pencadangan, dan kebijakan privasi.</div><div style="margin-top:16px"><button class="btn danger" onclick="clearAllData()">Hapus semua data lokal</button></div></div></section>`}
function render(){let c=document.getElementById('content');if(current==='dashboard')c.innerHTML=dashboard();else if(current==='rekap')c.innerHTML=rekapPage();else if(current==='pengaturan')c.innerHTML=settingsPage();else c.innerHTML=modulePage(current)}
function csvEscape(v){let s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}function download(name,content,type='text/csv;charset=utf-8;'){let blob=new Blob(['\ufeff',content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(mid){let m=modules.find(x=>x.id===mid),data=rows(mid),headers=m.fields.map(f=>f[1]),values=data.map(r=>m.fields.map(f=>f[0]==='siswaId'?studentName(r[f[0]]):r[f[0]]??''));download(`${mid}_${today()}.csv`,[headers,...values].map(r=>r.map(csvEscape).join(',')).join('\r\n'));toast('Ekspor CSV dimulai.')}
function exportAttendanceSummary(month){let students=rows('siswa'),att=rows('absensi').filter(a=>(a.tanggal||'').startsWith(month),),head=['Nama siswa','NIS','Bulan','Hadir','Sakit','Izin','Alpa','Total catatan','Persentase hadir'];let lines=students.map(s=>{let a=att.filter(x=>x.siswaId===s.id),n=Object.fromEntries(['Hadir','Sakit','Izin','Alpa'].map(k=>[k,a.filter(x=>x.status===k).length]));return [s.nama,s.nis,month,n.Hadir,n.Sakit,n.Izin,n.Alpa,a.length,a.length?Math.round(n.Hadir/a.length*100)+'%':''].map(csvEscape).join(',')});download(`rekap_absensi_${month}.csv`,[head.map(csvEscape).join(','),...lines].join('\r\n'));toast('Ekspor rekap dimulai.')}
function exportBackup(){download(`cadangan_administrasi_kelas_${today()}.json`,JSON.stringify({...db,backupAt:new Date().toISOString(),app:'Administrasi Kelas Digital'},null,2),'application/json');toast('Cadangan JSON diunduh.')}
function restoreBackup(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!x.tables||!confirm('Pulihkan cadangan? Semua data lokal saat ini akan diganti.'))return;for(let m of modules)if(!Array.isArray(x.tables[m.id]))x.tables[m.id]=[];db={tables:x.tables,meta:x.meta||{}};saveDB();go('dashboard');toast('Cadangan berhasil dipulihkan.')}catch(e){toast('File tidak valid atau tidak dapat dibaca.')}document.getElementById('restoreFile').value=''};reader.readAsText(file)}
function clearAllData(){if(!confirm('Yakin ingin menghapus SELURUH data administrasi dari browser ini?'))return;if(!confirm('Konfirmasi terakhir: data yang belum dicadangkan tidak dapat dipulihkan. Hapus sekarang?'))return;db={tables:Object.fromEntries(modules.map(m=>[m.id,[]])),meta:{}};saveDB();go('dashboard');toast('Seluruh data lokal telah dihapus.')}
function openBulkAttendance(){let d=document.getElementById('bulkDate').value||today(),students=rows('siswa').filter(s=>!s.status||s.status==='Aktif');if(!students.length){toast('Tambahkan data siswa terlebih dahulu.');return}editingModule='bulk';editingId=null;document.getElementById('modalTitle').textContent='Isi absensi satu kelas';document.getElementById('modalBody').innerHTML=`<div class="field" style="margin-bottom:15px"><label>Tanggal</label><input type="date" id="bulkAttendanceDate" value="${esc(d)}" required></div><div class="notice">Pilih status untuk setiap siswa. Siswa yang belum dipilih tidak akan dicatat. Catatan yang sudah ada pada tanggal tersebut akan diperbarui.</div><div class="table-wrap"><table><thead><tr><th>Nama siswa</th><th>Status kehadiran</th></tr></thead><tbody>${students.map(s=>{let old=rows('absensi').find(a=>a.tanggal===d&&a.siswaId===s.id);return `<tr><td>${esc(s.nama||'—')}</td><td><select data-student="${esc(s.id)}"><option value="">Tidak dicatat</option>${['Hadir','Sakit','Izin','Alpa'].map(st=>`<option ${old?.status===st?'selected':''}>${st}</option>`).join('')}</select></td></tr>`}).join('')}</tbody></table></div>`;document.querySelector('#dataForm .modal-foot button[type="submit"]').textContent='Simpan absensi';document.getElementById('modalBackdrop').classList.add('show')}
// Bulk attendance is handled separately to avoid silently overwriting unrelated records.
document.getElementById('dataForm').addEventListener('submit',function bulkHandler(e){if(editingModule!=='bulk')return;e.preventDefault();let date=document.getElementById('bulkAttendanceDate').value;if(!date){toast('Pilih tanggal absensi.');return}let selects=[...document.querySelectorAll('[data-student]')],count=0;for(let sel of selects){let sid=sel.dataset.student,st=sel.value;if(!st)continue;let old=rows('absensi').find(a=>a.tanggal===date&&a.siswaId===sid);if(old)old.status=st;else db.tables.absensi.push({id:id(),tanggal:date,siswaId:sid,status:st,keterangan:'',createdAt:new Date().toISOString()});count++}saveDB();closeModal();document.querySelector('#dataForm .modal-foot button[type="submit"]').textContent='Simpan data';editingModule=null;go('absensi');toast(`${count} catatan absensi disimpan.`)},true);
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});navRender();render();
</script></body></html>
